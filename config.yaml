# All tunable numbers live here. Change values only through the orchestrator; log changes in DECISIONS.md.

seed: 42

paths:
  raw: data/raw
  sackmann_dir: data/raw/tennis_atp/tennis-sackmann-archive-main/atp   # archive mirror (DECISIONS D-007)
  tml_dir: data/raw/tml
  odds_dir: data/raw/odds
  interim: data/interim
  processed: data/processed
  matches: data/interim/matches.parquet
  player_map: data/interim/player_map.csv
  player_overrides: config/player_overrides.csv
  odds: data/interim/odds.parquet
  features: data/processed/features.parquet
  models: models
  experiments: experiments
  reports: reports
  figures: reports/figures

data:
  first_year: 1990          # earliest season loaded (state warm-up)
  last_sackmann_year: 2026  # the archive covers through Roland Garros 2026 (early June 2026)
  feature_first_year: 2000  # rows of features.parquet start here (state still built from first_year)
  include_qual_chall: true  # load atp_matches_qual_chall_YYYY.csv (Challengers + qualifying update state)
  include_futures: false    # ITF/satellite files are not loaded
  training_levels: [A, G, M, F, D, O]
  qualifying_rounds: [Q1, Q2, Q3, Q4]
  round_order: [Q1, Q2, Q3, Q4, R128, R64, R32, R16, ER, RR, QF, SF, BR, F]   # ER: 2007 RR-experiment elimination round (D-013)
  surface_map: {Hard: Hard, Clay: Clay, Grass: Grass, Carpet: Hard}
  source_priority: [sackmann, tml, scraped]
  excluded_tourneys: ["Laver Cup"]   # exhibition: removed from matches entirely (D-022)
  level_overrides:                   # tourney_level corrections by exact tourney_name (D-022)
    - {name_regex: "^(Tour Finals|Masters Cup|ATP Finals)$", level: F}
    - {name_regex: "^[A-Za-z]+ Olympics$", level: O}      # "Athens Olympics", "Paris Olympics", ...
    - {name_regex: "^Next ?Gen Finals$", level: A}       # U21 event, short-set format: not the top-8 Finals (D-022)

cleaning:
  drop_walkovers: true
  retirement_updates_elo: false     # RET/DEF matches do not move Elo (default per PLAN section 2 rule 7)
  retirement_updates_stats: true    # partial stats from RET/DEF may enter rolling buffers
  retirement_updates_h2h: false     # assumption: an unfinished match is not an H2H win (logged in DECISIONS.md)
  retirement_updates_form: false    # assumption: an unfinished match is not a win/loss for last_k_winrate
  drop_conflicting_results: true    # D-014: drop both rows when one meeting is recorded twice with opposite winners

elo:
  start_rating: 1500.0
  # Dynamic K: if div_number == 0 -> K = k_factor, else K = min(max_k, max(base_k, div_number / (Ne + m)))
  # Tuned in Phase 4 (reports/elo_tuning.md, DECISIONS D-027): best 2015-2024 log loss on the widened grid.
  overall:
    k_factor: 24.0          # only used when div_number == 0
    div_number: 3200.0
    m: 1.0
    base_k: 16.0
    max_k: 100.0
    bonus_after_layoff: true
  surface:
    k_factor: 24.0
    div_number: 2400.0
    m: 10.0
    base_k: 24.0
    max_k: 64.0
    bonus_after_layoff: true
  # m used in K = div_number / (Ne + m):
  #   event_matches_so_far -> m = elo.<which>.m + matches the player has ALREADY played in this tourney_id (D-008)
  #   constant             -> m = elo.<which>.m
  # Never anything that depends on how far the player goes in the event.
  m_mode: event_matches_so_far
  layoff:
    threshold_days: 100
    min_gaps: 15            # bonus only applies when there are more than this many gaps
    start_bonus: 1.5
    step: 0.05
    floor: 1.0

features:
  rolling_n: 50             # last N matches WITH stats
  winrate_k: [5, 10, 50]
  elo_grad_window: 20
  recent_days_window: 14    # matches_last_14_days
  flip_augment_train: false # add flipped copies of TRAINING rows only
  rr_block_exempt_levels: [D]   # RR rounds of these levels are processed match by match (D-019)
  static_fill:                  # constants for missing static attributes; no missing-indicator (D-020)
    height: 185.0
    is_left: 0.0
    age: 26.0

elo_harness:
  warmup_matches: 10000
  tune_start: "2015-01-01"
  tune_end: "2024-12-31"
  grid:
    # Plan grid widened once (D-027): the best plan-grid setting sat on the div_number/base_k edges.
    div_number: [400, 800, 1200, 1600, 2400, 3200]
    m: [1, 5, 10]
    base_k: [0, 8, 16, 24, 32, 40]
    max_k: [32, 64, 100]
    bonus_after_layoff: [false, true]
    fixed_k: [24]

splits:
  # Development split used in Phases 3-5 for baselines and XGBoost tuning. No test period here:
  # the plan's real test sets are Wimbledon 2025 (split A) and 2026 H2 (split B). See DECISIONS.md D-004.
  dev:
    train_start: "2000-01-01"
    train_end: "2022-12-31"
    val_start: "2023-01-01"
    val_end: "2024-12-31"
  # Split A: the author's replication
  replication:
    train_start: "2000-01-01"
    train_end: "2024-12-31"
    val_start: "2025-01-01"
    val_end: "2025-06-29"     # day before Wimbledon 2025 (main draw started 2025-06-30)
    test_tourney: "Wimbledon"
    test_year: 2025
  # Split B: shortened forward test (human decision, DECISIONS D-017). The archive ends early June 2026, with no
  # June-November 2026 data and nothing to be downloaded or scraped for it. test_end is pinned so the test set
  # can't silently grow if data is added later.
  forward:
    train_start: "2000-01-01"
    train_end: "2025-12-31"
    val_start: "2026-01-01"
    val_end: "2026-03-31"
    test_start: "2026-04-01"
    test_end: "2026-06-07"          # end of archive data (last tourney_date 2026-06-01; Roland Garros 2026 final 7 Jun)
    report_tourneys: ["Roland Garros"]   # reported separately with bootstrap CIs

xgb:
  objective: "binary:logistic"
  eval_metric: logloss
  early_stopping_rounds: 100
  n_trials: 800
  n_trials_forward: 300
  max_n_estimators: 2000
  tree_method: hist
  nthread: 1                       # pinned: hist results change with the thread count (D-030); = train.NTHREAD
  # Tuned in Phase 5 (reports/xgb_tuning.md, D-030): best of 800 Optuna trials on dev val 2023-24 (trial 720).
  best_params:
    learning_rate: 0.017403824245571284
    max_depth: 7
    min_child_weight: 3.7070046985199285
    subsample: 0.7246419405377439
    colsample_bytree: 0.5151019491450788
    gamma: 0.1045539002555385
    reg_alpha: 0.06810140421533839
    reg_lambda: 3.0385256550684665
    n_estimators: 689              # trees at the dev early-stopping point (best_iteration + 1)
  search_space:
    learning_rate: [0.01, 0.1]     # log-uniform
    max_depth: [3, 8]
    min_child_weight: [1, 10]
    subsample: [0.5, 1.0]
    colsample_bytree: [0.5, 1.0]
    gamma: [0.0, 1.0]
    reg_alpha: [0.0, 10.0]
    reg_lambda: [1.0, 50.0]

evaluation:
  calibration_bins: 10
  bootstrap_samples: 2000
  ci_level: 0.95
  leakage_alarm_accuracy: 0.75
  log_loss_eps: 1.0e-15           # probability clip for log loss
  baseline_seasons: [2015, 2024]  # per-season baseline table range

leakage_tests:
  slow_recompute_samples: 200
  real_start_year: 2018     # real-data engine tests (1, 2, 4) use matches from this year on as their whole input
  shuffled_label_band: [0.47, 0.53]
  label_mean_band: [0.48, 0.52]

scraping:
  min_seconds_between_requests: 3.0

