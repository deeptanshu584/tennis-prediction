[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis"
version = "0.1.0"
description = "Leakage-free ATP men's singles match predictor (Elo + rolling serve/return stats + XGBoost)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pytest>=8.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "unidecode>=1.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that build features on real data (deselect with -m 'not slow')",
    "realdata: tests that require data/ to be populated",
]
