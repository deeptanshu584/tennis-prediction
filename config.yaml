# Betting odds (bookmaker baseline only; Phases 6-7). The parser never downloads (DECISIONS D-025).
odds:
  first_year: 2015
  last_year: 2025                  # 2026 only if the human provides it; rows after max_date are dropped (D-017)
  max_date: "2026-06-07"           # = splits.forward.test_end
  book_preference: [PS, Avg, B365] # Pinnacle, then market average, then Bet365
  levels: [G, M, A, F, O]          # Sackmann main-draw levels searched (tennis-data has no Davis Cup/Challengers/qualifying)
  pre_days: 3                      # Slams/Masters may start the Sunday before Sackmann's Monday tourney_date
  window_days: 21
  min_match_rate: 0.97
  max_unmatched_players: 5         # tolerated only if every affected row is non-Completed
